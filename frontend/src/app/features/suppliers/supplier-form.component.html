<div class="page-heading"><div><span class="eyebrow">FORNECEDORES</span><h1>{{editing?'Editar fornecedor':'Novo fornecedor'}}</h1><p>Registre os dados de contato e observações comerciais.</p></div><a routerLink="/responsáveis / origem">← Voltar</a></div><form [formGroup]="form" (ngSubmit)="save()" class="form-card"><div class="alert" *ngIf="error()">{{error()}}</div><div class="state" *ngIf="loading()">Carregando fornecedor...</div><ng-container *ngIf="!loading()"><section><div class="section-title"><span>01</span><div><h2>Identificação</h2><p>Dados principais do parceiro.</p></div></div><div class="grid"><label class="wide">Nome do fornecedor *<input formControlName="name" placeholder="Ex.: Distribuidora São Paulo"><small *ngIf="invalid('name')">Informe o nome do fornecedor.</small></label><label>Telefone<input formControlName="phone" placeholder="(11) 99999-9999"></label><label>E-mail<input type="email" formControlName="email" placeholder="contato@fornecedor.com"><small *ngIf="invalid('email')">Informe um e-mail válido.</small></label><label>Pessoa de contato<input formControlName="contactPerson" placeholder="Ex.: Carlos"></label></div></section><section><div class="section-title"><span>02</span><div><h2>Observações</h2><p>Informações úteis para futuras compras.</p></div></div><label>Observação<textarea rows="5" formControlName="notes" placeholder="Condições, dias de entrega, itens fornecidos..."></textarea></label></section><footer><a routerLink="/responsáveis / origem">Cancelar</a><button type="submit" [disabled]="saving()">{{saving()?'Salvando...':'Salvar fornecedor'}}</button></footer></ng-container></form>
