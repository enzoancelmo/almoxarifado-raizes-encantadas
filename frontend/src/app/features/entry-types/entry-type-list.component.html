<div class="page-heading"><div><span class="breadcrumb">Almoxarifado / Tipos de entrada</span><h1>Tipos de Entrada</h1><p>Cadastre origens de entrada como compra, doação e devolução.</p></div></div><div class="grid-page"><section class="panel form-mini"><h2>{{editing?'Editar tipo':'Novo tipo'}}</h2><label>Nome<input [(ngModel)]="form.name"></label><label>Descrição<textarea rows="4" [(ngModel)]="form.description"></textarea></label><label class="check"><input type="checkbox" [(ngModel)]="form.active"> Ativo</label><div class="actions-row"><button class="primary" (click)="save()" [disabled]="saving">{{saving?'Salvando...':'Salvar'}}</button><button (click)="newItem()" type="button">Limpar</button></div><div class="alert" *ngIf="error">{{error}}</div></section><section class="panel"><div *ngIf="loading" class="state">Carregando tipos...</div><div class="table-wrap" *ngIf="!loading"><table><thead><tr><th>Nome</th><th>Descrição</th><th>Status</th><th>Ações</th></tr></thead><tbody><tr *ngFor="let item of items"><td><strong>{{item.name}}</strong></td><td>{{item.description||'—'}}</td><td><span class="badge">{{item.active?'Ativo':'Inativo'}}</span></td><td class="actions"><button (click)="edit(item)">Editar</button><button (click)="toggle(item)">{{item.active?'Desativar':'Ativar'}}</button></td></tr></tbody></table></div></section></div>
