<div class="page-heading"><div><span class="eyebrow">COMUNICAÇÃO</span><h1>Mensagens para WhatsApp</h1><p>Textos prontos para divulgar produtos e oportunidades.</p></div><span>{{messages().length}} mensagem(ns)</span></div><div *ngIf="error()" class="alert">{{error()}}</div><div *ngIf="loading()" class="state">Preparando mensagens...</div><section class="grid" *ngIf="!loading()"><article *ngFor="let item of messages();let i=index"><header><div class="wa">W</div><div><strong>{{item.productName}}</strong><span>{{item.reason}}</span></div></header><blockquote>{{item.message}}</blockquote><button (click)="copy(item,i)">{{copied()===i?'✓ Mensagem copiada':'▣ Copiar mensagem'}}</button></article><div class="empty" *ngIf="!messages().length">Nenhuma mensagem sugerida para os produtos atuais.</div></section>
