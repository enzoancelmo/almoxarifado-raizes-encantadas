<div class="page-heading"><div><span class="eyebrow">ORGANIZAÇÃO</span><h1>Categorias</h1><p>Organize os itens para agilizar consultas e relatórios.</p></div><a routerLink="/categorias/nova">＋ Nova Categoria</a></div><div class="success" *ngIf="success()">✓ {{success()}}</div><div class="alert" *ngIf="error()">{{error()}}</div><section class="panel"><div class="toolbar"><label>⌕<input [ngModel]="search()" (ngModelChange)="search.set($event)" placeholder="Buscar categoria..."></label><span>{{filtered().length}} categoria(s)</span></div><div class="state" *ngIf="loading()">Carregando categorias...</div><div class="grid" *ngIf="!loading()&&filtered().length"><article *ngFor="let c of filtered()"><div class="icon">◇</div><div class="content"><strong>{{c.name}}</strong><p>{{c.description||'Sem descrição'}}</p></div><div class="actions"><a [routerLink]="['/categorias',c.id,'editar']" title="Editar">✎</a><button (click)="remove(c)" title="Excluir">⌫</button></div></article></div><div class="empty" *ngIf="!loading()&&!filtered().length">Nenhuma categoria encontrada.</div></section>
