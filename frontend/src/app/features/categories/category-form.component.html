<div class="page-heading"><div><span class="eyebrow">CATEGORIAS</span><h1>{{editing?'Editar categoria':'Nova categoria'}}</h1><p>Crie uma classificação clara para seus itens.</p></div><a routerLink="/categorias">← Voltar</a></div><form class="form-card" [formGroup]="form" (ngSubmit)="save()"><div class="alert" *ngIf="error()">{{error()}}</div><div class="state" *ngIf="loading()">Carregando...</div><ng-container *ngIf="!loading()"><label>Nome da categoria *<input formControlName="name" placeholder="Ex.: Padaria"><small *ngIf="form.controls.name.invalid&&form.controls.name.touched">Informe o nome da categoria.</small></label><label>Descrição<textarea formControlName="description" rows="4" placeholder="Descreva os itens desta categoria"></textarea></label><footer><a routerLink="/categorias">Cancelar</a><button [disabled]="saving()" type="submit">{{saving()?'Salvando...':'Salvar categoria'}}</button></footer></ng-container></form>
