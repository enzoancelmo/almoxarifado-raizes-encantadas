spring:
  application:
    name: almoxarifado-raizes-encantadas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/estoque_inteligente}
    username: ${DB_USERNAME:estoque_user}
    password: ${DB_PASSWORD:estoque_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:15}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${PORT:${SERVER_PORT:8080}}
jwt:
  secret: ${JWT_SECRET:estoque-inteligente-chave-local-desenvolvimento-2026-segura}
  expiration: ${JWT_EXPIRATION:86400000}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  admin:
    name: ${ADMIN_NAME:Administrador}
    email: ${ADMIN_EMAIL:admin@raizesencantadas.com}
    password: ${ADMIN_PASSWORD:admin123}
    reset-password: ${ADMIN_RESET_PASSWORD:${APP_ADMIN_RESET_PASSWORD:false}}
